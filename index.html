<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dalchini</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F1;--card:#fff;--ink:#1A2B29;--mute:#5E706D;--line:#D9E1DC;--acc:#0F766E;--on:#fff;--hi:#F2C94C;--warn:#C2410C}
@media(prefers-color-scheme:dark){:root{--bg:#101B1A;--card:#182726;--ink:#E8F0EE;--mute:#9DB1AD;--line:#2A3D3B;--acc:#3CC4B5;--on:#06201D;--warn:#FB923C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,'Noto Sans Devanagari',sans-serif}
h2{margin:0}button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;z-index:5}
.nm{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:800;font-size:24px;line-height:1.1;white-space:nowrap}
.tg{font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--mute);font-size:14px}
.hr{display:flex;gap:6px;align-items:center}#tb{white-space:nowrap;color:var(--mute);font-size:14px}
.wb{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:600;white-space:nowrap}.wb:disabled{opacity:.6}
main{max-width:620px;margin:0 auto;padding:14px 14px 110px}
.cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:6px;padding-bottom:4px}
.cats button{flex:none;padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line)}.cats .on{background:var(--ink);color:var(--bg)}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.item small{display:block;color:var(--mute)}.item>div:not(.pic){flex:1}
.pic{flex:none;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--line)}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.sk{background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.pic.sk{animation:none}}
.add{background:var(--acc);color:var(--on);border-radius:10px;padding:8px 16px;font-weight:600}
.qty{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}.qty button{background:none;width:34px;height:34px;font-size:20px;color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar button{display:flex;justify-content:space-between;width:100%;max-width:620px;margin:auto;background:var(--acc);color:var(--on);padding:14px 18px;border-radius:14px;font-weight:600;font-size:17px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
label{display:block;font-weight:600;margin:12px 0 4px}input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.row{display:flex;justify-content:space-between;padding:3px 0}.hint{color:var(--mute);font-size:14px}
.big{font-size:18px;font-weight:700;padding:10px;border-radius:12px;background:var(--bg);margin:8px 0;text-align:center}
.note{background:var(--hi);color:#1A2B29;border-radius:10px;padding:8px 12px;margin:8px 0}
.ghost{background:none;color:var(--mute);padding:10px 0;width:100%}
.cnl{width:100%;padding:11px;border-radius:12px;background:none;border:2px solid var(--warn);color:var(--warn);font-weight:600}
.strip{width:100%;border-radius:10px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);padding:9px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:14px}
.mbox{background:var(--card);border-radius:18px;padding:18px calc(18px) calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:420px}
.stars{display:flex;gap:6px;justify-content:center;margin:12px 0}.stars button{background:none;font-size:40px;line-height:1;color:var(--line)}.stars .on{color:#E0A800}
.lnk{display:block;text-align:center;text-decoration:none;padding:12px;margin-top:10px}
</style>
</head>
<body>
<header><div><div class="nm" id="cn"></div><div class="tg" id="tg"></div></div>
<span class="hr"><button class="wb" id="wb">🔔 Waiter</button><button class="wb" id="wx" hidden aria-label="Nahi, rehne do">✕</button><span id="tb"></span></span></header>
<main id="app"></main><div class="bar" id="bar" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,doc,onSnapshot,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ CONFIG: har cafe ke liye sirf yeh hissa badlein ============ */
const CFG={cafeName:'Dalchini',tagline:'Hungry? We’ve got you',googleReview:'https://maps.app.goo.gl/TpiMEkMFrUSWwyHU7'};
const db=getFirestore(initializeApp({
  apiKey:"AIzaSyAlzbtm0PrXL_E4ugLGIU7iQiZ47DfpmbY",authDomain:"dalchini-afab1.firebaseapp.com",projectId:"dalchini-afab1",
  storageBucket:"dalchini-afab1.firebasestorage.app",messagingSenderId:"388013293113",appId:"1:388013293113:web:364e5569b2a9b5d19d57e8"}));
/* MENU: id = chhota lowercase naam (kabhi badalna nahi), c = category, n = naam, h = Hindi naam (awaaz ke liye),
   d = chhota vivaran (optional), p = daam, img = photo ka naam images/ folder mein (optional), fav:true = hamesha "pasand" mein */
const MENU=[
{id:'butterpaneer',c:'Paneer Destination',n:'Butter Paneer Masala',h:'बटर पनीर मसाला',p:205},
{id:'paneersirca',c:'Paneer Destination',n:'Paneer Sirca Pyaz',h:'पनीर सिरका प्याज़',p:225},
{id:'charcoalpaneer',c:'Paneer Destination',n:'Charcoal Paneer Masala',h:'चारकोल पनीर मसाला',p:225},
{id:'paneerzalzala',c:'Paneer Destination',n:'Paneer Zalzala',h:'पनीर ज़लज़ला',p:235},
{id:'spinachpaneer',c:'Paneer Destination',n:'Spinach Paneer',h:'स्पिनच पनीर',p:195},
{id:'nawabimalai',c:'Paneer Destination',n:'Nawabi Malai Paneer',h:'नवाबी मलाई पनीर',p:235},
{id:'paneerteenmirch',c:'Paneer Destination',n:'Paneer Teen Mirch',h:'पनीर तीन मिर्च',p:235},
{id:'paneerkumbh',c:'Paneer Destination',n:'Paneer Kumbh',h:'पनीर कुंभ',p:235},
{id:'chefspecial',c:'Paneer Destination',n:"Chef's Special",h:'शेफ़ स्पेशल',p:245},
{id:'alootakatak',c:'Sabzi Mandi',n:'Aloo Takatak',h:'आलू टकाटक',p:185},
{id:'bhindidopyaza',c:'Sabzi Mandi',n:'Bhindi Do Pyaza',h:'भिंडी दो प्याज़ा',p:175},
{id:'chaapbutter',c:'Sabzi Mandi',n:'Chaap Butter Masala',h:'चाप बटर मसाला',p:225},
{id:'masaledarkofta',c:'Sabzi Mandi',n:'Masaledar Malai Kofta',h:'मसालेदार मलाई कोफ़्ता',p:225},
{id:'creamykofta',c:'Sabzi Mandi',n:'Creamy Malai Kofta',h:'क्रीमी मलाई कोफ़्ता',p:235},
{id:'khambapalakkofta',c:'Sabzi Mandi',n:'Khamba Palak Kofta',h:'खम्बा पालक कोफ़्ता',p:225},
{id:'dilliwalechole',c:'Sabzi Mandi',n:'Dilli Wale Chole',h:'दिल्ली वाले छोले',p:185},
{id:'lasoonimakai',c:'Sabzi Mandi',n:'Lasooni Makai Palak',h:'लसूनी मकई पालक',p:195},
{id:'vegkalimirch',c:'Sabzi Mandi',n:'Veg Kali Mirch',h:'वेज काली मिर्च',p:205},
{id:'millijuli',c:'Sabzi Mandi',n:'Milli Juli Sabziya',h:'मिली जुली सब्ज़ियाँ',p:185},
{id:'cheesebutter',c:'Sabzi Mandi',n:'Cheese Butter Masala',h:'चीज़ बटर मसाला',p:235},
{id:'kajumasala',c:'Sabzi Mandi',n:'Kaju Masala',h:'काजू मसाला',p:225},
{id:'creamykaju',c:'Sabzi Mandi',n:'Creamy Kaju Curry',h:'क्रीमी काजू करी',p:245}];
/* ======================================================================== */

const REVIEW_MS=300000,CANCEL_MS=120000,POP='🔥 सबसे ज़्यादा पसंद';
const ST={new:'🔴 Order bhej diya. Kitchen ke accept karne ka intezaar',prep:'🟡 Aapka order ban raha hai',ready:'🟢 Ready! Aapka order aa raha hai',done:'⚪ Order serve ho gaya',cancel:'❌ Order cancel ho gaya'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),inr=n=>'₹'+n;
const table=new URLSearchParams(location.search).get('table')||'1',parcel=table==='parcel';
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const jp=(k)=>{try{return JSON.parse(ls.get(k)||'[]')}catch(e){return []}};
let S={},menuErr='',mine=jp('mine'),dis=new Set(jp('fbd')),O={},unsub={},rt={},err='',busy=false;
let C={cat:'',cart:{},screen:'menu',ask:0,fb:0,wq:0,wqt:0,wt:0};
const byId=id=>MENU.find(m=>m.id===id),avail=()=>MENU.filter(m=>(S[m.id]||{}).on!==false);
const pop=()=>{const a=avail(),f=a.filter(m=>m.fav),t=a.filter(m=>!m.fav&&((S[m.id]||{}).sold||0)>0).sort((x,y)=>S[y.id].sold-S[x.id].sold);return[...f,...t].slice(0,Math.max(5,f.length))};
const cats=()=>{const c=[...new Set(avail().map(m=>m.c))];return pop().length?[POP,...c]:c};
const total=()=>Object.entries(C.cart).reduce((s,[i,q])=>s+byId(i).p*q,0),count=()=>Object.values(C.cart).reduce((a,b)=>a+b,0);
const canCancel=o=>o.status==='new'&&Date.now()-o.t<CANCEL_MS;
const saveMine=()=>ls.set('mine',JSON.stringify(mine));
const pic=m=>m.img?`<div class="pic sk"><img src="images/${esc(m.img)}" alt="" width="72" height="72" loading="lazy" onload="this.parentNode.classList.remove('sk')" onerror="this.parentNode.remove()"></div>`:'';
const refresh=()=>{if(C.screen!=='checkout')render();showFb()};

function watch(id){if(unsub[id])return;unsub[id]=onSnapshot(doc(db,'orders',id),s=>{
  if(!s.exists()||Date.now()-s.data().t>6*3600e3){drop(id);return}
  O[id]={id,...s.data()};const o=O[id];
  if(o.status==='done'&&!o.rating&&!dis.has(id)&&o.dt&&!rt[id])rt[id]=setTimeout(()=>{if(O[id]&&!O[id].rating&&!dis.has(id)){C.fb=id;showFb()}},Math.max(0,o.dt+REVIEW_MS-Date.now()));
  refresh()},()=>drop(id))}
function drop(id){if(unsub[id])unsub[id]();delete unsub[id];delete O[id];mine=mine.filter(x=>x!==id);saveMine();if(!mine.length&&C.screen==='track')C.screen='menu';refresh()}

function render(){
  const a=$('#app'),bar=$('#bar'),os=mine.map(id=>O[id]).filter(Boolean);bar.hidden=true;let h='';
  if(C.screen==='track'){
    if(!os.length){a.innerHTML='<p class="hint">Aapke orders load ho rahe hain...</p>';return}
    const allEnd=os.every(x=>['done','cancel'].includes(x.status));
    h='<button class="add" id="more" style="width:100%;padding:12px;margin-bottom:10px">➕ और items मँगाएँ</button>'+
    os.map(o=>`<div class="sheet"><h2 style="font-size:18px">${esc(o.name)} · Order #${esc(o.id.slice(-4))}</h2><p class="hint">${o.table==='parcel'?'🥡 Parcel':'Table '+esc(o.table)} · ${o.people} log</p><div class="big">${ST[o.status]||''}</div>
    ${o.items.map(i=>`<div class="row"><span>${i.q} × ${esc(i.n)}</span><span>${inr(i.q*i.p)}</span></div>`).join('')}
    <div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><b>Total</b><b>${inr(o.total)}</b></div>
    ${o.note?`<div class="note">Aapka note: ${esc(o.note)}</div>`:''}
    ${canCancel(o)?`<button class="cnl" data-cnl="${o.id}"></button>`:''}${o.status==='prep'||(o.status==='new'&&!canCancel(o))?'<p class="hint">Ab order cancel nahi ho sakta.</p>':''}</div>`).join('')+
    (err?`<p class="note">${esc(err)}</p>`:'')+'<p class="hint">Payment counter par hoga.</p>'+(allEnd?'<button class="ghost" id="again">Naya order karo (purane orders hatayein)</button>':'');
  }else if(C.screen==='checkout'){
    h=`<div class="sheet"><h2>Order confirm karo</h2><div style="margin-top:8px">${Object.entries(C.cart).map(([i,q])=>`<div class="row"><span>${q} × ${esc(byId(i).n)}</span><span>${inr(q*byId(i).p)}</span></div>`).join('')}</div>
    <div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><b>Total</b><b>${inr(total())}</b></div>
    <label for="nm">Aapka naam</label><input id="nm" value="${esc(ls.get('nm'))}" placeholder="Jaise: Rahul" autocomplete="name" maxlength="40">
    <label for="ph">Mobile number (optional)</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" value="${esc(ls.get('ph'))}"><p class="hint" style="margin:4px 0 0">Number sirf aapka pichla order yaad rakhne ke liye hai.</p>
    <label for="pp">Kitne log?</label><input id="pp" type="number" min="1" max="30" value="2" inputmode="numeric">
    <label for="nt">Kitchen ke liye note (optional)</label><textarea id="nt" rows="2" maxlength="200" placeholder="Jaise: spicy kam, extra namak"></textarea>
    <p class="hint" style="margin-top:10px">💵 Payment: counter par. ${parcel?'🥡 Parcel order':'Table '+esc(table)}</p>${err?`<p class="note">${esc(err)}</p>`:''}
    <button class="add" id="place" style="width:100%;padding:13px;font-size:17px">Order place karo</button><button class="ghost" id="back">← Menu par wapas</button></div>`;
  }else{
    const cs=cats();if(!C.picked||!cs.includes(C.cat))C.cat=cs[0]||'';
    const list=C.cat===POP?pop():avail().filter(m=>m.c===C.cat);
    h=(menuErr?`<p class="hint">⚠️ Live availability nahi mil rahi (${esc(menuErr)}).</p>`:'')+(os.length?`<button class="strip" id="seeo">📋 आपके orders (${os.length}) देखें</button>`:'')+
    `<div class="cats">${cs.map(c=>`<button class="${c===C.cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`+
    (list.length?list.map(m=>`<div class="item">${pic(m)}<div><b>${esc(m.n)}</b>${m.d?`<small>${esc(m.d)}</small>`:''}<b style="display:block">${inr(m.p)}</b></div>${C.cart[m.id]?`<div class="qty"><button data-m="${m.id}" aria-label="Kam">−</button><b>${C.cart[m.id]}</b><button data-p="${m.id}" aria-label="Badhao">+</button></div>`:`<button class="add" data-p="${m.id}">Add</button>`}</div>`).join(''):'<p class="hint">Abhi koi item uplabdh nahi hai.</p>');
    if(count()){bar.hidden=false;bar.innerHTML=`<button id="go"><span>${count()} item · ${inr(total())}</span><span>Order dekho</span></button>`}
  }
  a.innerHTML=h;
  const on=(s,f)=>{const e=document.querySelector(s);if(e)e.onclick=f};
  a.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{C.cat=b.dataset.c;C.picked=1;render()});
  a.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=b.dataset.p;C.cart[i]=(C.cart[i]||0)+1;render()});
  a.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=b.dataset.m;if(--C.cart[i]<=0)delete C.cart[i];render()});
  on('#go',()=>{C.screen='checkout';err='';render();scrollTo(0,0)});on('#back',()=>{C.screen='menu';err='';render()});
  on('#more',()=>{C.screen='menu';render()});on('#seeo',()=>{C.screen='track';render()});
  on('#again',()=>{[...mine].forEach(drop);C.cart={};C.screen='menu';render()});
  on('#place',async()=>{const name=$('#nm').value.trim();if(!name){$('#nm').focus();return}if(busy)return;busy=true;$('#place').textContent='Bhej raha hai...';const slow=setTimeout(()=>{const b=$('#place');if(b&&busy)b.textContent='Internet dheema hai, thoda wait karein...'},10000);
    const data={table,name,phone:$('#ph').value.trim(),people:Math.max(1,Math.min(30,Math.floor(+$('#pp').value)||1)),note:$('#nt').value.trim(),
      items:Object.entries(C.cart).map(([i,q])=>({id:i,n:byId(i).n,h:byId(i).h,p:byId(i).p,q})),total:total(),status:'new',t:Date.now()};
    try{const r=await addDoc(collection(db,'orders'),data);ls.set('nm',data.name);ls.set('ph',data.phone);mine.unshift(r.id);saveMine();watch(r.id);C.cart={};C.screen='track';err=''}
    catch(e){err='Order nahi ja paya. Internet check karke dobara try karein.'}
    clearTimeout(slow);busy=false;render();scrollTo(0,0)});
  a.querySelectorAll('[data-cnl]').forEach(bn=>bn.onclick=async()=>{const id=bn.dataset.cnl;if(C.ask!==id){C.ask=id;tick();return}C.ask=0;
    try{await updateDoc(doc(db,'orders',id),{status:'cancel'});err=''}catch(e){err='Cancel nahi ho paya. Kitchen ne order shuru kar diya hoga.'}render()});
  tick()}

function tick(){document.querySelectorAll('[data-cnl]').forEach(b=>{const o=O[b.dataset.cnl];if(!o)return;const s=Math.ceil((CANCEL_MS-(Date.now()-o.t))/1000);if(s<=0){render();return}
    b.textContent=`${C.ask===o.id?'हाँ, पक्का cancel करें':'Order cancel karein'} (${Math.floor(s/60)}:${String(s%60).padStart(2,'0')})`});
  const w=$('#wb'),x=$('#wx');if(w){const c=Date.now()-C.wt<60000;w.disabled=c;w.textContent=c?'✅ बुला लिया':C.wq?'✅ हाँ, बुलाएँ':'🔔 Waiter';x.hidden=!C.wq||c}}
setInterval(tick,1000);

let fbSig='';
function showFb(){const old=$('#fbm'),o=C.fb&&O[C.fb],sig=o?o.id+'|'+(o.rating||0):'';
  if(!o){if(old)old.remove();fbSig='';return}
  if(old&&sig===fbSig)return;
  const keep=old&&old.querySelector('#fbt')?old.querySelector('#fbt').value:'';
  if(old)old.remove();fbSig=sig;const r=o.rating||0,m=document.createElement('div');m.id='fbm';m.className='modal';
  m.innerHTML=`<div class="mbox"><h2>${esc(o.name)}, khana kaisa laga?</h2><div class="stars">${[1,2,3,4,5].map(n=>`<button data-s="${n}" aria-label="${n} star" class="${n<=r?'on':''}">★</button>`).join('')}</div>
  ${r&&r<=3?'<textarea id="fbt" rows="2" maxlength="300" placeholder="Kya behtar ho sakta tha? (sirf cafe ko dikhega)"></textarea>':''}
  ${r?`<a class="add lnk" href="${esc(CFG.googleReview)}" target="_blank" rel="noopener">Google par review likhein</a>`:''}<button class="ghost" id="fbx">${r?'Band karein':'Baad mein'}</button></div>`;
  document.body.appendChild(m);{const t=m.querySelector('#fbt');if(t)t.value=keep}
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const n=+b.dataset.s;o.rating=n;showFb();try{await updateDoc(doc(db,'orders',o.id),{rating:n})}catch(e){}});
  m.querySelector('#fbx').onclick=()=>{const t=m.querySelector('#fbt'),txt=t?t.value.trim().slice(0,300):'';
    dis.add(o.id);ls.set('fbd',JSON.stringify([...dis]));C.fb=0;showFb();
    if(txt)updateDoc(doc(db,'orders',o.id),{fb:txt}).catch(()=>{})}}

/* Waiter: pehli baar dabane par confirm poochta hai, 4 second mein apne-aap wapas */
function wReset(){C.wq=0;clearTimeout(C.wqt);tick()}
if(parcel){$('#wb').remove();$('#wx').remove()}else{
  $('#wb').onclick=async()=>{if(Date.now()-C.wt<60000)return;if(!C.wq){C.wq=1;tick();clearTimeout(C.wqt);C.wqt=setTimeout(wReset,4000);return}
    clearTimeout(C.wqt);C.wq=0;C.wt=Date.now();tick();try{await addDoc(collection(db,'calls'),{table,status:'open',t:Date.now()})}catch(e){C.wt=0;$('#wb').textContent='नहीं गया'}};
  $('#wx').onclick=wReset}

$('#cn').textContent='☕ '+CFG.cafeName;$('#tg').textContent=CFG.tagline;$('#tb').textContent=parcel?'🥡 Parcel':'Table '+table;document.title=CFG.cafeName;
